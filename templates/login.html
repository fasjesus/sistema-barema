<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo - COLCIC</title>
    
    <script src="https://code.iconify.design/iconify-icon/1.0.1/iconify-icon.min.js"></script>
    
    <style>
        :root {
            --primary-blue: #003366;
            --accent-yellow: #ffe45e;
            --text-dark: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-blue);
            background-image: linear-gradient(180deg, var(--primary-blue) 0%, #001a33 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .login-container img {
            width: 80px;
            margin-bottom: 20px;
        }

        h2 {
            color: var(--primary-blue);
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--primary-blue);
            font-weight: bold;
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--primary-blue);
            outline: none;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-yellow);
            color: var(--text-dark);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-login:hover {
            background-color: #f0d54d;
            transform: translateY(-2px);
        }

        .error-msg {
            background: #fff0f0;
            color: #d9534f;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            border: 1px solid #ffdada;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #999;
            text-decoration: none;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--primary-blue);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <iconify-icon icon="line-md:account-filled" width="60" style="color: var(--primary-blue);"></iconify-icon>
        
        <h2>Painel COLCIC</h2>
        <p>Acesso exclusivo para a coordenação</p>

        {% if erro %}
            <div class="error-msg">
                <iconify-icon icon="bx:error-circle"></iconify-icon>
                {{ erro }}
            </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" placeholder="Digite seu usuário" required>
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="********" required>
            </div>

            <button type="submit" class="btn-login">
                <iconify-icon icon="ri:login-box-line"></iconify-icon>
                Entrar
            </button>
        </form>

        <a href="/" class="back-link">
            <iconify-icon icon="pajamas:arrow-left"></iconify-icon>
            Voltar ao site principal
        </a>
    </div>

</body>
</html>
