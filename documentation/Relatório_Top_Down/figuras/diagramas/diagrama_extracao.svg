<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f4f63"/>
    </marker>
    <style>
      .box{fill:#f8fbff;stroke:#2f4f63;stroke-width:2;rx:8}
      .head{fill:#fef3c7;stroke:#2f4f63;stroke-width:2}
      .name{font:700 18px Arial,sans-serif;fill:#102a43}
      .txt{font:15px Arial,sans-serif;fill:#102a43}
      .small{font:13px Arial,sans-serif;fill:#334e68}
      .rel{stroke:#2f4f63;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#2f4f63;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}
      .lbl{font:14px Arial,sans-serif;fill:#2f4f63;font-weight:700}
    </style>
  </defs>
  <rect width="1500" height="780" fill="#fff"/>

  <g transform="translate(560,55)">
    <rect class="box" width="385" height="180"/>
    <rect class="head" width="385" height="38"/>
    <text class="name" x="192" y="25" text-anchor="middle">ExtratorDadosCertificado</text>
    <text class="txt" x="18" y="68">+ extract(conteudo)</text>
    <text class="small" x="18" y="96">orquestra a extracao</text>
    <text class="small" x="18" y="120">texto direto, OCR, regex e IA</text>
    <text class="small" x="18" y="144">retorna ExtractedCertificateData</text>
  </g>

  <g transform="translate(80,360)">
    <rect class="box" width="270" height="115"/>
    <rect class="head" width="270" height="38"/>
    <text class="name" x="135" y="25" text-anchor="middle">ExtratorTextoPDF</text>
    <text class="txt" x="18" y="75">+ extract(conteudo)</text>
  </g>

  <g transform="translate(420,340)">
    <rect class="box" width="260" height="155"/>
    <rect class="head" width="260" height="38"/>
    <text class="name" x="130" y="25" text-anchor="middle">ExtratorOCR</text>
    <text class="txt" x="18" y="68">+ from_env()</text>
    <text class="txt" x="18" y="96">+ extract(conteudo)</text>
    <text class="small" x="18" y="125">usa Tesseract</text>
  </g>

  <g transform="translate(760,340)">
    <rect class="box" width="325" height="155"/>
    <rect class="head" width="325" height="38"/>
    <text class="name" x="162" y="25" text-anchor="middle">AnalisadorRegexCertificado</text>
    <text class="txt" x="18" y="75">+ extract_hours(texto)</text>
    <text class="txt" x="18" y="105">+ extract_dates(texto)</text>
  </g>

  <g transform="translate(1160,340)">
    <rect class="box" width="275" height="155"/>
    <rect class="head" width="275" height="38"/>
    <text class="name" x="137" y="25" text-anchor="middle">ExtratorIACertificado</text>
    <text class="txt" x="18" y="68">+ from_env()</text>
    <text class="txt" x="18" y="96">+ extract(texto)</text>
    <text class="small" x="18" y="125">fallback complementar</text>
  </g>

  <g transform="translate(580,600)">
    <rect class="box" width="345" height="130"/>
    <rect class="head" width="345" height="38"/>
    <text class="name" x="172" y="25" text-anchor="middle">ExtractedCertificateData</text>
    <text class="txt" x="18" y="68">+ text: texto</text>
    <text class="txt" x="18" y="93">+ carga_horaria: numero</text>
    <text class="txt" x="18" y="118">+ datas: lista</text>
  </g>

  <path class="rel" d="M610 235 L230 360"/>
  <text class="lbl" x="370" y="300">usa</text>
  <path class="rel" d="M690 235 L550 340"/>
  <text class="lbl" x="585" y="292">usa se texto insuficiente</text>
  <path class="rel" d="M800 235 L915 340"/>
  <text class="lbl" x="850" y="292">interpreta</text>
  <path class="rel" d="M945 190 L1245 340"/>
  <text class="lbl" x="1080" y="265">usa se regex falhar</text>
  <path class="rel" d="M750 235 L750 600"/>
  <text class="lbl" x="765" y="430">produz</text>
  <path class="dash" d="M1160 480 L925 625"/>
  <text class="lbl" x="1005" y="565">tambem produz</text>
</svg>
