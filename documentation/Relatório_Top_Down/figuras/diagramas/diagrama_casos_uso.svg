<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1150" viewBox="0 0 1700 1150">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#263f52"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .system { fill: #f8fbff; stroke: #263f52; stroke-width: 2.4; rx: 26; }
      .system-title { font: 700 26px Arial, sans-serif; fill: #102a43; }
      .actor-name { font: 19px Arial, sans-serif; fill: #111827; }
      .usecase { fill: #ffffff; stroke: #263f52; stroke-width: 2.1; }
      .usecase-text { font: 17px Arial, sans-serif; fill: #111827; }
      .association { stroke: #263f52; stroke-width: 2.1; fill: none; }
      .include { stroke: #263f52; stroke-width: 1.9; stroke-dasharray: 8 6; fill: none; marker-end: url(#seta); }
      .note { fill: #fff8db; stroke: #b7791f; stroke-width: 1.8; rx: 8; }
      .note-text { font: 15px Arial, sans-serif; fill: #3f2d0c; }
      .label-bg { fill: #ffffff; }
      .label { font: 14px Arial, sans-serif; fill: #263f52; font-weight: 700; }
      .icon { stroke: #111827; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .head-blue { fill: #dbeafe; stroke: #111827; stroke-width: 3; }
      .head-green { fill: #dcfce7; stroke: #111827; stroke-width: 3; }
      .head-gray { fill: #e5e7eb; stroke: #111827; stroke-width: 3; }
    </style>
  </defs>

  <rect class="bg" width="1700" height="1150"/>

  <!-- Sistema -->
  <rect class="system" x="320" y="70" width="1060" height="1000"/>
  <text class="system-title" x="850" y="118" text-anchor="middle">Sistema Web de Barema</text>

  <!-- Atores -->
  <g transform="translate(95,235)">
    <circle cx="70" cy="30" r="22" class="head-blue"/>
    <path d="M70 52 L70 128 M25 80 L70 70 L115 80 M70 128 L35 188 M70 128 L105 188" class="icon"/>
    <text class="actor-name" x="70" y="230" text-anchor="middle">Aluno</text>
  </g>

  <g transform="translate(1490,280)">
    <circle cx="70" cy="30" r="22" class="head-green"/>
    <path d="M70 52 L70 128 M25 80 L70 70 L115 80 M70 128 L35 188 M70 128 L105 188" class="icon"/>
    <text class="actor-name" x="70" y="230" text-anchor="middle">Coordenador</text>
  </g>

  <g transform="translate(1490,790)">
    <circle cx="70" cy="30" r="22" class="head-gray"/>
    <path d="M70 52 L70 128 M25 80 L70 70 L115 80 M70 128 L35 188 M70 128 L105 188" class="icon"/>
    <text class="actor-name" x="70" y="230" text-anchor="middle">Administrador</text>
  </g>

  <!-- Casos de uso do aluno -->
  <ellipse class="usecase" cx="560" cy="215" rx="150" ry="48"/>
  <text class="usecase-text" x="560" y="211" text-anchor="middle">Preencher</text>
  <text class="usecase-text" x="560" y="235" text-anchor="middle">barema</text>

  <ellipse class="usecase" cx="560" cy="335" rx="150" ry="48"/>
  <text class="usecase-text" x="560" y="331" text-anchor="middle">Anexar</text>
  <text class="usecase-text" x="560" y="355" text-anchor="middle">certificados</text>

  <ellipse class="usecase" cx="760" cy="470" rx="170" ry="54"/>
  <text class="usecase-text" x="760" y="466" text-anchor="middle">Gerar documento</text>
  <text class="usecase-text" x="760" y="490" text-anchor="middle">do barema</text>

  <ellipse class="usecase" cx="560" cy="610" rx="150" ry="48"/>
  <text class="usecase-text" x="560" y="606" text-anchor="middle">Baixar</text>
  <text class="usecase-text" x="560" y="630" text-anchor="middle">documento</text>

  <ellipse class="usecase" cx="760" cy="750" rx="180" ry="56"/>
  <text class="usecase-text" x="760" y="746" text-anchor="middle">Solicitar análise</text>
  <text class="usecase-text" x="760" y="770" text-anchor="middle">da coordenação</text>

  <!-- Casos de uso comuns/coordenador -->
  <ellipse class="usecase" cx="1120" cy="300" rx="145" ry="48"/>
  <text class="usecase-text" x="1120" y="306" text-anchor="middle">Autenticar-se</text>

  <ellipse class="usecase" cx="1120" cy="445" rx="175" ry="54"/>
  <text class="usecase-text" x="1120" y="441" text-anchor="middle">Consultar solicitações</text>
  <text class="usecase-text" x="1120" y="465" text-anchor="middle">de análise</text>

  <ellipse class="usecase" cx="1120" cy="585" rx="165" ry="54"/>
  <text class="usecase-text" x="1120" y="581" text-anchor="middle">Abrir documento</text>
  <text class="usecase-text" x="1120" y="605" text-anchor="middle">do aluno</text>

  <ellipse class="usecase" cx="1120" cy="725" rx="160" ry="52"/>
  <text class="usecase-text" x="1120" y="721" text-anchor="middle">Registrar parecer</text>
  <text class="usecase-text" x="1120" y="745" text-anchor="middle">da análise</text>

  <!-- Casos de uso do administrador -->
  <ellipse class="usecase" cx="1120" cy="870" rx="170" ry="54"/>
  <text class="usecase-text" x="1120" y="866" text-anchor="middle">Acessar área</text>
  <text class="usecase-text" x="1120" y="890" text-anchor="middle">administrativa</text>

  <ellipse class="usecase" cx="760" cy="920" rx="160" ry="52"/>
  <text class="usecase-text" x="760" y="916" text-anchor="middle">Gerenciar usuários</text>
  <text class="usecase-text" x="760" y="940" text-anchor="middle">e solicitações</text>

  <ellipse class="usecase" cx="560" cy="1010" rx="165" ry="52"/>
  <text class="usecase-text" x="560" y="1006" text-anchor="middle">Consultar registros</text>
  <text class="usecase-text" x="560" y="1030" text-anchor="middle">do sistema</text>

  <!-- Associações Aluno -->
  <path class="association" d="M230 305 L420 215"/>
  <path class="association" d="M235 335 L415 335"/>
  <path class="association" d="M235 365 L600 470"/>
  <path class="association" d="M235 405 L420 610"/>
  <path class="association" d="M235 435 L585 750"/>

  <!-- Associações Coordenador -->
  <path class="association" d="M1490 350 L1265 300"/>
  <path class="association" d="M1490 390 L1285 445"/>
  <path class="association" d="M1490 430 L1280 585"/>
  <path class="association" d="M1490 470 L1270 725"/>

  <!-- Associações Administrador -->
  <path class="association" d="M1490 845 L1265 300"/>
  <path class="association" d="M1490 880 L1285 870"/>
  <path class="association" d="M1490 925 L920 920"/>
  <path class="association" d="M1490 960 L725 1010"/>

  <!-- Includes principais -->
  <path class="include" d="M680 434 L600 365"/>
  <rect class="label-bg" x="605" y="383" width="88" height="24"/>
  <text class="label" x="649" y="401" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M680 434 L600 260"/>
  <rect class="label-bg" x="610" y="315" width="88" height="24"/>
  <text class="label" x="654" y="333" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M1035 405 L1120 348"/>
  <rect class="label-bg" x="1040" y="362" width="88" height="24"/>
  <text class="label" x="1084" y="380" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M1055 535 L1120 348"/>
  <rect class="label-bg" x="1052" y="430" width="88" height="24"/>
  <text class="label" x="1096" y="448" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M1065 675 L1120 348"/>
  <rect class="label-bg" x="1060" y="500" width="88" height="24"/>
  <text class="label" x="1104" y="518" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M1120 816 L1120 348"/>
  <rect class="label-bg" x="1130" y="560" width="88" height="24"/>
  <text class="label" x="1174" y="578" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M875 890 L990 870"/>
  <rect class="label-bg" x="905" y="850" width="88" height="24"/>
  <text class="label" x="949" y="868" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M675 985 L990 885"/>
  <rect class="label-bg" x="790" y="915" width="88" height="24"/>
  <text class="label" x="834" y="933" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- Nota de pré-condição -->
  <g transform="translate(370,800)">
    <rect class="note" width="320" height="95"/>
    <text class="note-text" x="160" y="30" text-anchor="middle">Pré-condição</text>
    <text class="note-text" x="160" y="56" text-anchor="middle">Para solicitar análise,</text>
    <text class="note-text" x="160" y="78" text-anchor="middle">o aluno deve baixar o documento.</text>
  </g>
  <path class="include" d="M690 848 L640 795"/>
</svg>
