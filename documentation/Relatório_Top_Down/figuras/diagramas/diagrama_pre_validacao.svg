<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="820" viewBox="0 0 1550 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f4f63"/>
    </marker>
    <style>
      .box{fill:#f8fbff;stroke:#2f4f63;stroke-width:2;rx:8}
      .head{fill:#ede9fe;stroke:#2f4f63;stroke-width:2}
      .name{font:700 18px Arial,sans-serif;fill:#102a43}
      .txt{font:15px Arial,sans-serif;fill:#102a43}
      .small{font:13px Arial,sans-serif;fill:#334e68}
      .rel{stroke:#2f4f63;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#2f4f63;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}
      .lbl{font:14px Arial,sans-serif;fill:#2f4f63;font-weight:700}
    </style>
  </defs>
  <rect width="1550" height="820" fill="#fff"/>

  <g transform="translate(565,50)">
    <rect class="box" width="420" height="180"/>
    <rect class="head" width="420" height="38"/>
    <text class="name" x="210" y="25" text-anchor="middle">CertificateValidationProcessor</text>
    <text class="txt" x="18" y="70">+ validate_certificate()</text>
    <text class="txt" x="18" y="98">+ validate_activity()</text>
    <text class="txt" x="18" y="126">+ validate()</text>
    <text class="small" x="18" y="152">coordena extracao e pre-validacao</text>
  </g>

  <g transform="translate(70,330)">
    <rect class="box" width="315" height="120"/>
    <rect class="head" width="315" height="38"/>
    <text class="name" x="157" y="25" text-anchor="middle">ExtratorDadosCertificado</text>
    <text class="txt" x="18" y="78">+ extract()</text>
  </g>

  <g transform="translate(470,310)">
    <rect class="box" width="355" height="165"/>
    <rect class="head" width="355" height="38"/>
    <text class="name" x="177" y="25" text-anchor="middle">BasicCertificatePreValidator</text>
    <text class="txt" x="18" y="70">+ validate_certificate()</text>
    <text class="txt" x="18" y="98">+ validate_activity_hours()</text>
    <text class="txt" x="18" y="126">+ validate_duplicate_certificates()</text>
  </g>

  <g transform="translate(910,300)">
    <rect class="box" width="345" height="185"/>
    <rect class="head" width="345" height="38"/>
    <text class="name" x="172" y="25" text-anchor="middle">CertificateAIPreValidator</text>
    <text class="txt" x="18" y="68">+ from_env()</text>
    <text class="txt" x="18" y="96">+ validate_certificate()</text>
    <text class="txt" x="18" y="124">+ validate_activity()</text>
    <text class="small" x="18" y="152">usa IA quando habilitada</text>
  </g>

  <g transform="translate(1320,330)">
    <rect class="box" width="190" height="110"/>
    <rect class="head" width="190" height="38"/>
    <text class="name" x="95" y="23" text-anchor="middle">AIClient</text>
    <text class="small" x="95" y="37" text-anchor="middle">interface</text>
    <text class="txt" x="18" y="78">+ complete_json()</text>
  </g>

  <g transform="translate(910,590)">
    <rect class="box" width="345" height="120"/>
    <rect class="head" width="345" height="38"/>
    <text class="name" x="172" y="25" text-anchor="middle">CertificateAIPromptOptimizer</text>
    <text class="txt" x="18" y="75">+ build_payload()</text>
    <text class="txt" x="18" y="100">+ build_prompt()</text>
  </g>

  <g transform="translate(95,600)">
    <rect class="box" width="300" height="130"/>
    <rect class="head" width="300" height="38"/>
    <text class="name" x="150" y="25" text-anchor="middle">ExtractedCertificateData</text>
    <text class="txt" x="18" y="68">+ text</text>
    <text class="txt" x="18" y="93">+ carga_horaria</text>
    <text class="txt" x="18" y="118">+ datas</text>
  </g>

  <g transform="translate(500,610)">
    <rect class="box" width="285" height="105"/>
    <rect class="head" width="285" height="38"/>
    <text class="name" x="142" y="25" text-anchor="middle">ActivityRule</text>
    <text class="txt" x="18" y="72">+ id, descricao</text>
    <text class="txt" x="18" y="96">+ min_horas, max_horas</text>
  </g>

  <g transform="translate(1320,590)">
    <rect class="box" width="190" height="115"/>
    <rect class="head" width="190" height="38"/>
    <text class="name" x="95" y="25" text-anchor="middle">AIValidationResult</text>
    <text class="txt" x="18" y="72">+ erros</text>
    <text class="txt" x="18" y="97">+ irregularidades</text>
  </g>

  <path class="rel" d="M565 145 L228 330"/>
  <text class="lbl" x="360" y="245">extrai dados</text>
  <path class="rel" d="M695 230 L648 310"/>
  <text class="lbl" x="645" y="278">valida</text>
  <path class="dash" d="M910 145 L1082 300"/>
  <text class="lbl" x="990" y="222">opcional</text>
  <path class="rel" d="M1255 385 L1320 385"/>
  <text class="lbl" x="1268" y="368">consulta</text>
  <path class="rel" d="M1082 485 L1082 590"/>
  <text class="lbl" x="1098" y="545">monta prompt</text>
  <path class="rel" d="M228 450 L245 600"/>
  <text class="lbl" x="255" y="530">produz</text>
  <path class="rel" d="M648 475 L642 610"/>
  <text class="lbl" x="660" y="550">usa regras</text>
  <path class="rel" d="M1255 388 L1320 625"/>
  <text class="lbl" x="1295" y="520">retorna</text>
</svg>
